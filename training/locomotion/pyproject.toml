[project]
name = "hsim-locomotion-training"
version = "0.1.0"
description = "Phase 0: train G1 locomotion policies with mjlab and export ONNX + manifest"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mjlab==1.6.0",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "pyyaml>=6.0",
  # rsl-rl 5.5 passes wandb.Settings(start_method=...), which wandb 0.29+ rejects
  "wandb>=0.25,<0.29",
]
