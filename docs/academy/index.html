/* 5 ─ VLAs */
lesson({
  id: 'a-vla', ch: 'arms', mins: 10,
  title: "Vision-language-action models",
  lede: "ACT and diffusion policy only know the task you showed them. A VLA starts from a big pretrained vision-language model and gets fine-tuned to output robot actions.",
  build() {
    const quant = Widget('Approach A: actions as tokens', body => {
      let bins = 16; const holder = h('div'), out = h('div.readout');
      const f = t => .8 * Math.sin(2 * Math.PI * t) + .18 * Math.sin(6 * Math.PI * t + .6);
      const draw = () => {
        const p = Plot(660, 210, { x: [0, 1], y: [-1.1, 1.1], xt: [0, .25, .5, .75, 1], yt: [-1, 0, 1], xl: 'time within an action chunk', yl: 'shoulder target', m: { l: 44 } });
        const q = v => { const b = clamp(Math.floor((v + 1) / 2 * bins), 0, bins - 1); return -1 + (b + .5) * 2 / bins; };
        const N = 200; let mx = 0, se = 0; const cont = [], stair = [];
        for (let i = 0; i <= N; i++) { const t = i / N, v = f(t), qv = q(v); cont.push([p.sx(t), p.sy(v)]); stair.push([p.sx(t), p.sy(qv)]); mx = Math.max(mx, Math.abs(v - qv)); se += (v - qv) ** 2; }
        p.svg.append(Path(path(stair), 'var(--c)', 3), Path(path(cont), 'var(--hl)', 2, 'none', { 'stroke-dasharray': '5 4' }), T(p.m.l + 8, p.m.t + 14, '- - the smooth motion you want', 'lbl', 'start', { style: 'fill:var(--hl)' }), T(p.m.l + 8, p.m.t + 30, '━ what the token vocabulary can say', 'lbl', 'start', { style: 'fill:var(--c)' }));
        holder.innerHTML = ''; holder.append(p.svg);
        out.innerHTML = ''; out.append(Chip('vocabulary size', bins + ' bins / dimension', 'c'), Chip('worst-case error', fx(mx, 3), mx > .1 ? 'bad' : 'ok'), Chip('RMS error', fx(Math.sqrt(se / (N + 1)), 3)));
      };
      const opts = [4, 8, 16, 32, 64, 128, 256];
      body.append(holder, Slider({ label: 'bins per dimension', min: 0, max: 6, step: 1, value: 2, fmt: v => opts[v], on: v => { bins = opts[v]; draw(); } }), out, h('p.cap', null, 'RT-2 split each action dimension into 256 buckets and treated each bucket as a new word. The language model is unchanged, but the motion is quantized, which is rough for fast, precise control.')); draw();
    });

    const arch = Widget('Two ways to get from a VLM to motor commands', body => {
      let m = 'A'; const box = (t, d, strong) => h('div', { style: { border: '1.5px solid ' + (strong ? 'var(--c)' : 'var(--line)'), background: strong ? 'var(--c-soft)' : 'var(--surface)', borderRadius: '10px', padding: '9px 12px' } }, h('b', { style: { fontSize: '14.5px' } }, t), h('div', { style: { fontSize: '13px', color: 'var(--ink3)' } }, d));
      const st = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } }), eq = h('div.eq');
      const draw = () => {
        st.innerHTML = '';
        st.append(box('Inputs', '[image tokens] + [text: “pick up the cube”]'), box('Pretrained VLM backbone', 'billions of parameters trained on internet-scale data, so it knows what a cup is and what “the red one” means', true), h('div.mono', { style: { textAlign: 'center' } }, '↓'));
        if (m === 'A') { st.append(box('Predicts action tokens', 'each action dimension is binned; each bin is a new word in the vocabulary'), h('div.mono', { style: { textAlign: 'center' } }, '↓ de-tokenize'), box('Continuous joint commands', 'loses detail, awkward for fast precise motion')); eq.innerHTML = 'fine-tuning loss: <span class="k">token prediction</span>, same as language modeling'; }
        else { st.append(box('Action expert (small separate network)', 'turns the VLM’s scene and task representation into smooth motion using flow matching, a close relative of diffusion', true), h('div.mono', { style: { textAlign: 'center' } }, '↓'), box('Continuous actions, high frequency', 'no discretization')); eq.innerHTML = 'fine-tuning loss: <span class="k">flow matching</span> on the continuous action (moving from noise toward the real action)'; }
      };
      body.append(Seg([{ v: 'A', label: 'A · Tokenize actions (RT-2)' }, { v: 'B', label: 'B · Action expert (π0)' }], 'A', v => { m = v; draw(); }), st, eq); draw();
    });


    return [
      P('A VLA starts from a pretrained vision-language model, the kind behind image-understanding chatbots, which has been trained on huge amounts of internet images and text. It already knows what a cup is, what “pick up the red one” means and how objects sit relative to each other. That’s something like 3 billion parameters of world knowledge for free. You attach a way to produce actions and fine-tune the whole thing on robot demos. This is why VLAs handle new objects and new instructions where ACT can’t.'),
      P('A VLM outputs text tokens and the robot needs joint commands, so there are two ways to bridge that.'),
      H3('A. Tokenize the actions'),
      P('This is the original RT-2 approach. Each action dimension is split into bins (256, for example) and every bin becomes a new word in the vocabulary. Actions turn into more tokens, predicted the same way as the next word in a sentence, and the model barely changes. The downside is that chopping smooth motion into buckets loses information and is awkward for fast, precise control.'),
      quant,
      H3('B. A separate action expert'),
      P('This is what π0 does. The pretrained VLM still does the understanding, turning the image and instruction into a representation of the scene and the task. A separate small network, the action expert, takes that representation and outputs continuous actions using flow matching, a close relative of diffusion. Nothing is discretized, so control stays smooth and can run at high frequency.'),
      arch,
      P('Fine-tuning feeds the image and instruction through the model and trains its output to match the demonstrated action. Approach A uses a token-prediction loss and approach B uses a flow-matching loss on the continuous action. You can fine-tune with LoRA (freeze the big backbone and train small adapters, which is cheap) or go with fuller fine-tuning. It’s the same idea as fine-tuning an LLM, except you’re adding a new kind of output.'),
      H2('The three big players'),
      UL('<b>NVIDIA GR00T</b> splits the model into two systems. System 2 is a slow VLM that reasons about the task, and System 1 is a fast diffusion action expert with about 10 ms latency. It’s the same slow-planner, fast-controller split you see across the whole stack, just inside the manipulation policy. They’re betting on data scale, with 20,000+ hours of human egocentric video plus sim.', '<b>Google Gemini Robotics</b> reasons in language first, then translates that plan into actions. It merges data from different robot types using motion transfer.', '<b>Physical Intelligence (the π series)</b> uses a single flow-based stream that generates actions through diffusion or flow matching. They introduced approach B for VLAs.'),
      P('They differ in how cleanly they separate thinking from acting (NVIDIA the most, PI the least), whether they reason in language first (Google does), and how they get around the cost of robot demos (all three are moving toward video, sim and transfer between robots). Underneath, each one is a pretrained understanding model plus an action generator, fine-tuned on robot data.'),
      Check({ q: 'Where does a VLA’s ability to follow “pick up the red one” for an object it never saw come from?', opts: ['Your robot demonstrations', 'The pretrained vision-language model', 'IK'], ans: 1, why: 'The backbone already knows about objects and language.' }),
      Check({ q: 'What’s the main downside of tokenizing actions?', opts: ['It needs a new model', 'Splitting continuous motion into bins loses information and is rough for fast, precise control', 'It can’t use language'], ans: 1, why: 'Fewer bins means bigger steps. Approach B keeps the output continuous.' }),
    ];
  },
  cards: [
    { q: "What is a VLA, and why does it generalize better than ACT?", a: "A pretrained vision-language model plus an action output, fine-tuned on robot demos. It brings internet-scale knowledge of objects and language that your own demos couldn’t provide." },
    { q: "What’s the difference between approach A and B for getting actions out of a VLM?", a: "<b>A</b> (RT-2) bins each action dimension (e.g. 256) and predicts tokens, with a token-prediction loss, and loses information. <b>B</b> (π0) uses a separate action expert with flow matching, so the output is continuous and smooth." },
    { q: "How do NVIDIA, Google and Physical Intelligence differ?", a: "<b>GR00T</b> has System 2 (slow VLM) plus System 1 (fast diffusion, ~10 ms). <b>Google</b> reasons in language first, then acts. <b>PI</b> uses one flow-based stream and is the most unified." },

  ],
});

/* 6 ─ Frontier */
lesson({
  id: 'a-frontier', ch: 'arms', mins: 8,
  title: "Learning from experience",
  lede: "Imitation can only be as good as its demos. The newest fix adds reinforcement learning on top of the VLA, and it reuses advantage from PPO.",
  build() {
    const rungs = [
      { n: 'IK', adds: 'Geometry. It reaches any pose, anywhere, instantly.', fails: 'No dexterity. It can’t grasp, close on an object or handle slip.', needs: 'Encoders always, a camera for the target, and an IMU only if the base floats.' },
      { n: 'ACT', adds: 'Dexterity from demos, with 100-action chunks against compounding error.', fails: 'Averages across demonstrations (z = 0), so it breaks when a task has clearly different modes. Copies its demos.', needs: '50 to 200 teleoperated demos.' },
      { n: 'Diffusion Policy', adds: 'Samples from the full distribution of good actions, so it handles multiple modes.', fails: 'About 10× the inference compute, and it still doesn’t generalize past its demos.', needs: 'The same demos, plus ~10 denoising passes.' },
      { n: 'VLA', adds: 'World knowledge from a pretrained VLM, so it handles new objects and language instructions.', fails: 'Still imitation, so it’s limited by its demos and can’t learn from failure. It also has no memory and only reacts to the current frame.', needs: 'A large pretrained backbone plus robot demos to fine-tune on (LoRA or full).' },
      { n: 'VLA + RL from experience', adds: 'Goes past its demonstrations and recovers from mistakes by learning from its own successes and failures (π*0.6, RECAP).', fails: 'Needs real deployment, human interventions, and a way to use RL with flow-based actions.', needs: 'Demos, on-policy collection and human interventions.' },
    ];
    const ladder = Widget('The ladder', body => {
      let cur = 0; const list = h('div', { style: { display: 'flex', flexDirection: 'column-reverse', gap: '6px' } }), panel = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } });
      const draw = () => {
        list.innerHTML = ''; rungs.forEach((r, i) => list.append(h('button', { type: 'button', style: { textAlign: 'left', border: '1.5px solid ' + (i === cur ? 'var(--c)' : 'var(--line)'), background: i === cur ? 'var(--c-soft)' : 'var(--surface)', borderRadius: '10px', padding: '9px 14px', fontWeight: 600, marginLeft: (i * 14) + 'px' }, on: { click() { cur = i; draw(); } } }, 'Rung ' + (i + 1) + ' · ' + r.n)));
        const r = rungs[cur]; panel.innerHTML = ''; panel.append(h('p', { style: { margin: 0 }, html: '<b style="color:var(--ok)">Adds:</b> ' + r.adds }), h('p', { style: { margin: 0 }, html: '<b style="color:var(--bad)">Still breaks:</b> ' + r.fails }), h('p', { style: { margin: 0 }, html: '<b>Needs:</b> ' + r.needs }));
      };
      body.append(h('div.grid2', null, list, panel)); draw();
    });

    const loop = Widget('Locomotion and manipulation compared', body => {
      const rows = [['Rollout of experience', 'The robot deploys in the real world and collects its own successes and failures'], ['Advantage: better or worse than average?', 'Still the signal. The policy improves using advantage, learned from real deployment'], ['PPO clipped update', 'Flow-matching action generation doesn’t fit standard PPO math cleanly, so they use <b>advantage-conditioning</b>'], ['Exploration vs exploitation', 'Human interventions when it gets stuck, plus on-policy attempts'], ['Reward from the environment', 'Success and failure outcomes, alongside demonstrations']];
      body.append(h('div.scroll-x', null, h('table.tt', { style: { whiteSpace: 'normal' } }, h('thead', null, h('tr', null, h('th', { style: { textAlign: 'left' } }, 'Locomotion (PPO)'), h('th', { style: { textAlign: 'left' } }, 'Manipulation frontier (RECAP)'))), h('tbody', null, rows.map(r => h('tr', null, h('td', { style: { textAlign: 'left', whiteSpace: 'normal', verticalAlign: 'top' } }, r[0]), h('td', { style: { textAlign: 'left', whiteSpace: 'normal' }, html: r[1] })))))));
    });

    return [
      P('ACT, diffusion policy and a fine-tuned VLA all copy demonstrations. They can’t do better than the demos, and they can’t learn from failures, because failures aren’t in the demo set.'),
      P('Physical Intelligence’s π*0.6 (late 2025) puts reinforcement learning on top of an imitation-trained VLA. The robot gets deployed, collects its own successes and failures, and improves from them using a method called RECAP. RECAP combines demonstrations, the robot’s own on-policy data and human interventions for when it gets stuck. What it uses to improve the policy is advantage, the same “better or worse than average” number from PPO.'),
      P('There’s one wrinkle. Flow-matching VLAs can’t use standard PPO directly, because flow-based action generation doesn’t fit the usual RL math cleanly, so they use advantage-conditioning instead. The idea is the same. Push the policy toward good actions and away from bad ones, learned from real deployment as well as from demos.'),
      loop,
      Note('Manipulation is heading toward the same recipe locomotion already uses: pretrain on demonstrations, then improve with RL from real experience.'),
      H2('The ladder'),
      ladder,
      Match({ q: 'Which method fits each situation?', rows: [{ l: 'Move the hand to wherever a camera says the object is, with no learning', r: 'IK' }, { l: '50 demos of one grasp style, one fast forward pass', r: 'ACT' }, { l: 'Demos go left and right around an obstacle and must not be averaged', r: 'Diffusion Policy' }, { l: 'Follow “pick up the red one” for objects that weren’t in your demos', r: 'VLA' }, { l: 'Get better than the demos using its own successes and failures', r: 'VLA + RL from experience' }], why: 'Each rung adds something the one below it doesn’t have.' }),
      H3('Other frontier topics'),
      UL('<b>Memory.</b> Standard VLAs have none and only react to the current frame. Newer work adds memory for long tasks that need earlier steps remembered.', '<b>Force and tactile sensing.</b> Vision alone misses contact forces, which matter a lot for delicate manipulation.', '<b>Mixture of experts.</b> Route different sub-tasks to specialized sub-networks so capacity can grow efficiently.'),
      Check({ q: 'What limits ACT, diffusion policy and a fine-tuned VLA?', opts: ['Backbone size', 'They’re imitation learners, so they can’t beat their demos or learn from failure', 'Camera resolution'], ans: 1, why: 'Getting past that needs learning from the robot’s own experience.' }),
      Check({ q: 'Why can’t a flow-matching VLA use standard PPO directly?', opts: ['PPO needs images', 'Flow-based action generation doesn’t fit the standard RL math cleanly, so advantage-conditioning is used', 'PPO only works for legs'], ans: 1, why: 'Advantage survives as an idea even though PPO’s ratio and clip don’t.' }),
    ];
  },
  cards: [
    { q: "What limits ACT, diffusion and a fine-tuned VLA?", a: "They’re imitation. They can’t exceed their demos and can’t learn from failure." },
    { q: "What are π*0.6 and RECAP?", a: "Physical Intelligence’s method (late 2025) for improving an imitation-trained VLA with RL from real deployment. It uses demos, on-policy experience and human interventions, driven by advantage." },
    { q: "Why is advantage-conditioning used for flow-based VLAs?", a: "Flow-matching action generation doesn’t fit standard PPO math cleanly. It’s the same idea with a different mechanism." },
    { q: "What’s each rung of the ladder in one line?", a: "IK is geometry with no dexterity. ACT is imitation and averages. Diffusion samples modes at ~10× the compute. A VLA adds world knowledge. VLA + RL can go past the demos." },
    { q: "What are three other frontier topics?", a: "Memory (VLAs have none), force and tactile sensing, and mixture of experts." },
  ],
});

const loopPt = (u, X0, Y0, RW, RH) => { // point on a rectangular loop, u in [0,1]
  const s = (u % 1) * 2 * (RW + RH); let x, y;
  if (s < RW) { x = s; y = 0; } else if (s < RW + RH) { x = RW; y = s - RW; } else if (s < 2 * RW + RH) { x = RW - (s - RW - RH); y = RH; } else { x = 0; y = RH - (s - 2 * RW - RH); }
  return [X0 + x, Y0 + y];
};

/* 1 ─ what SLAM is */
lesson({
  id: 'p-slam', ch: 'see', mins: 7,
  title: "What SLAM is",
  lede: "SLAM works out where a camera is and builds a map of the places it has been, both from the same stream of images.",
  build() {
    const tri = Widget('Triangulating one point from two views', body => {
      let base = 170, L = [330, 70]; const SIG = 3 * Math.PI / 180, svg = svgRoot(660, 260, { 'aria-label': 'Two cameras looking at one landmark' }), out = h('div.readout');
      const draw = () => {
        svg.innerHTML = ''; const Y = 226, A = [330 - base / 2, Y], B = [330 + base / 2, Y];
        const wedge = c => { const a = Math.atan2(L[1] - c[1], L[0] - c[0]), len = Math.hypot(L[0] - c[0], L[1] - c[1]) + 60; return `M${c[0]} ${c[1]} L${c[0] + len * Math.cos(a - SIG)} ${c[1] + len * Math.sin(a - SIG)} L${c[0] + len * Math.cos(a + SIG)} ${c[1] + len * Math.sin(a + SIG)}Z`; };
        svg.append(S('path', { d: wedge(A), fill: 'var(--c)', opacity: .35 }), S('path', { d: wedge(B), fill: 'var(--c)', opacity: .35 }), Line(A[0], A[1], L[0], L[1], 'var(--c)', 1.5), Line(B[0], B[1], L[0], L[1], 'var(--c)', 1.5),
          Rect(A[0] - 11, A[1] - 6, 22, 14, 'var(--ink)', { rx: 3 }), Rect(B[0] - 11, B[1] - 6, 22, 14, 'var(--ink)', { rx: 3 }), T(A[0], A[1] + 26, 'camera position 1', 'axis', 'middle'), T(B[0], B[1] + 26, 'camera position 2', 'axis', 'middle'),
          Circle(L[0], L[1], 6, 'var(--hl)', { stroke: 'var(--ink)', 'stroke-width': 1.5 }), T(L[0] + 12, L[1] - 8, 'feature (drag me)', 'lbl'));
        const Z = Y - L[1]; out.innerHTML = ''; out.append(Chip('baseline', Math.round(base) + ' px'), Chip('depth uncertainty', '≈ ' + fx(Z * Z * SIG / base, 1) + ' px', Z * Z * SIG / base > 30 ? 'bad' : 'ok'), Chip('sideways uncertainty', '≈ ' + fx(Z * SIG, 1) + ' px'));
      };
      drag(svg, p => { L = [clamp(p.x, 70, 590), clamp(p.y, 30, 170)]; draw(); });
      body.append(svg, Slider({ label: 'baseline', min: 20, max: 420, step: 5, value: base, fmt: v => v + ' px', on: v => { base = v; draw(); } }), out,
        h('p.cap', null, 'Each camera measures the direction to the feature with a small angular error (3° here). The darker overlap is where the feature could actually be. Depth uncertainty is roughly distance² × angle error ÷ baseline.')); draw();
    });
    return [
      H2('The chicken-and-egg problem'),
      P('SLAM stands for simultaneous localization and mapping. To know where you are you need a map, and to build a map you need to know where you are. SLAM does both together, and each estimate helps improve the other.'),
      P('In practice a camera moves through a room. From the images alone (an IMU can help), SLAM produces two things at once. One is the camera’s path through 3D space, and the other is a 3D map of the room made of points that mark where physical features are. Neither is known ahead of time, and both come out of a single optimization.'),
      H2('Why it can be solved'),
      P('If you see the same corner of a table from two camera positions, the way that corner shifts between the two images limits two things at once: how the camera moved, and where the corner sits in 3D. Stack up thousands of those constraints across hundreds of features and many camera positions and you can solve for everything together.'),
      tri,
      P('When the two viewpoints are close together the two rays are nearly parallel, so the point where they cross is poorly pinned down. Depth gets better as the baseline grows, which is one reason the camera has to move.'),
      H2('What SLAM doesn’t tell you'),
      P('The map is a sparse cloud of anonymous 3D points. SLAM has no idea that a group of them is a cube. Putting objects in the room is a separate job on top of it, covered in the lesson on objects, frames and TF.'),
      Check({ q: 'What’s the chicken-and-egg problem in SLAM?', opts: ['You need a map to localize, and you need to know your position to build the map', 'You need a camera to build a map, and a map to calibrate the camera', 'You need an IMU to run the camera'], ans: 0, why: 'SLAM estimates the trajectory and the map together, so each one constrains the other.' }),
      Check({ q: 'Why does a very small baseline give poor depth?', opts: ['The rays from the two positions are almost parallel, so where they cross is uncertain', 'The camera can’t see the feature', 'The descriptors stop matching'], ans: 0, why: 'Depth error scales roughly with distance squared times the angular error, divided by the baseline.' }),
    ];
  },
  cards: [
    { q: "What does SLAM stand for and what problem does it solve?", a: "Simultaneous localization and mapping. Localizing needs a map and mapping needs a position, so both get estimated together from the same images." },
    { q: "What two things does visual SLAM produce?", a: "The camera’s trajectory through 3D space, and a 3D map made of points at physical feature locations." },
    { q: "Why can two views constrain both the camera motion and the feature position?", a: "The same corner shifts between the two images by an amount that depends on both where the camera moved and where the corner is in 3D. Many of these constraints get solved together." },
    { q: "Does SLAM know what objects are in the room?", a: "No. The map is anonymous points. Objects come from a separate detector or pose estimator." },
  ],
});

/* 2 ─ ORB-SLAM3 */
lesson({
  id: 'p-orb', ch: 'see', mins: 8,
  title: "ORB-SLAM3",
  lede: "ORB-SLAM3 is the standard feature-based visual SLAM system. It tracks a sparse set of points and splits the work across three threads that run at different rates.",
  build() {
    const th = Widget('The three threads over four seconds', body => {
      const W = 660, Hh = 200, WIN = 4, x0 = 170, wpx = 470, svg = svgRoot(W, Hh, { 'aria-label': 'Timeline of the tracking, local mapping and loop closing threads' }), g = S('g');
      const rows = [['Tracking', '30 Hz, every frame', 52], ['Local mapping', 'once per keyframe', 108], ['Loop closing', 'when a place is revisited', 164]];
      svg.append(...rows.flatMap(([a, b, y]) => [T(10, y - 2, a, 'lbl-b'), T(10, y + 14, b, 'axis'), Line(x0, y + 5, x0 + wpx, y + 5, 'var(--line)', 1)]), g, Line(x0 + wpx, 20, x0 + wpx, 180, 'var(--ink3)', 1.5), T(x0 + wpx, 14, 'now', 'axis', 'middle'));
      let t = 0;
      loop(dt => {
        t += dt; g.innerHTML = ''; const px = s => x0 + (s - (t - WIN)) / WIN * wpx;
        for (let k = Math.ceil((t - WIN) * 30); k <= Math.floor(t * 30); k++) {
          const s = k / 30, kf = k % 12 === 0; g.append(Line(px(s), kf ? 30 : 40, px(s), 62, 'var(--c)', kf ? 2.5 : 1.4));
          if (kf) g.append(Rect(px(s), 100, .26 / WIN * wpx, 18, 'var(--c)', { rx: 2, opacity: .85 }));
        }
        for (let k = Math.ceil((t - WIN - .8) / 5); k <= Math.floor(t / 5 + .01); k++) { const s = 2.2 + k * 5; g.append(Rect(px(s), 156, .8 / WIN * wpx, 18, 'var(--hl)', { rx: 2 })); }
      });
      body.append(svg, h('p.cap', null, 'The taller ticks in the tracking row are keyframes, and each one kicks off a block of local mapping work. Loop closing only fires now and then. Timing is at real speed and the scene scrolls left.'));
    });
    return [
      H2('Feature-based'),
      P('ORB-SLAM3 doesn’t use whole images. It tracks a sparse set of distinctive points.'),
      H3('ORB features'),
      P('In each image the detector picks out a few hundred keypoints: corners, blobs and other high-contrast spots that are easy to recognize again from a different angle. For each keypoint it computes a descriptor, a compact binary fingerprint of the patch of image around it. The same physical corner seen from a slightly different position or rotation gives a similar descriptor, so you can match “this corner in frame 50” with “the same corner in frame 51.” ORB gets used because it’s very fast to compute and match, which is what lets SLAM run in real time.'),
      H2('Three threads'),
      UL('<b>Tracking</b> runs on every frame, about 30 Hz. It extracts ORB features, matches them against the local map and works out where the camera must be right now. It only looks at a small set of nearby map points, which keeps it fast. It also decides whether the frame should become a keyframe, meaning a saved reference frame that gets added to the map.', '<b>Local mapping</b> runs once per keyframe. It triangulates new 3D map points from the keyframe’s features, using the shift between it and nearby keyframes to get depth. Then it runs local bundle adjustment, which jointly refines the recent keyframe poses and the map points they see by minimizing reprojection error (the gap between where a 3D point should show up in an image and where it was actually observed). It runs behind tracking so it never blocks it.', '<b>Loop closing</b> is rare and event-driven. It watches for the robot coming back to somewhere it has been, and fixes the accumulated drift when it does. The next lesson covers it.'),
      th,
      H2('The Atlas'),
      P('The 3 in ORB-SLAM3 is about staying robust when tracking gets lost, for example when the camera is covered, moves suddenly or looks at a blank wall. Rather than failing, the system starts a new map. If it later recognizes a place that connects the new map to an old one, it merges them. The collection of maps is called the Atlas.'),
      Real('If tracking keeps getting lost, the scene probably has too few features (blank walls) or the camera is moving fast enough to blur. Both come straight from how the tracking thread works.'),
      Check({ q: 'Which thread runs at camera framerate?', opts: ['Tracking', 'Local mapping', 'Loop closing'], ans: 0, why: 'Tracking runs on every frame, about 30 Hz. Local mapping runs per keyframe, and loop closing only fires occasionally.' }),
      Check({ q: 'What does local bundle adjustment minimize?', opts: ['Reprojection error, the gap between where a 3D point should appear in an image and where it was observed', 'The number of keyframes', 'Descriptor length'], ans: 0, why: 'It jointly refines recent keyframe poses and the map points they see.' }),
    ];
  },
  cards: [
    { q: "What’s an ORB feature and what’s a descriptor?", a: "A keypoint (a corner or blob) that’s easy to recognize again, plus a descriptor, which is a compact binary fingerprint of the patch around it. It’s cheap to compute and match." },
    { q: "What are ORB-SLAM3’s three threads?", a: "<b>Tracking</b> (every frame, ~30 Hz), <b>local mapping</b> (per keyframe, triangulation and local bundle adjustment), and <b>loop closing</b> (event-driven, corrects drift)." },
    { q: "What’s a keyframe?", a: "A saved reference frame that tracking adds to the map when a frame is informative enough." },
    { q: "What’s bundle adjustment?", a: "Jointly refining keyframe poses and 3D map points by minimizing reprojection error." },
    { q: "What does the Atlas add in ORB-SLAM3?", a: "When tracking is lost it starts a new map instead of failing, and merges maps later if it recognizes a place that connects them." },
  ],
});

/* 3 ─ drift and loop closure */
lesson({
  id: 'p-loop', ch: 'see', mins: 8,
  title: "Drift and loop closure",
  lede: "Small tracking errors build up over time. Loop closure removes them by noticing that the robot is back somewhere it has been.",
  build() {
    const dr = Widget('Walking a loop', body => {
      let D = 60, closed = false; const W = 660, Hh = 290, X0 = 170, Y0 = 78, RW = 320, RH = 170, N = 120, DIR = [.8, -.6], svg = svgRoot(W, Hh, { 'aria-label': 'A walked loop with and without loop closure' }), out = h('div.readout');
      const draw = () => {
        svg.innerHTML = ''; const tr = [], es = []; let worst = 0;
        for (let i = 0; i <= N; i++) { const p = loopPt(i / N, X0, Y0, RW, RH), d = Math.pow(i / N, 1.3) - (closed ? i / N : 0), e = [p[0] + DIR[0] * D * d, p[1] + DIR[1] * D * d]; tr.push(p); es.push(e); worst = Math.max(worst, Math.hypot(e[0] - p[0], e[1] - p[1])); }
        svg.append(Path(path(tr), 'var(--line)', 2, 'none', { 'stroke-dasharray': '4 5' }), Path(path(es), 'var(--c)', 3), Circle(tr[0][0], tr[0][1], 6, 'var(--ink)'), T(tr[0][0] - 10, tr[0][1] - 10, 'start', 'axis', 'end'));
        const e = es[N]; svg.append(Circle(e[0], e[1], 6, 'var(--c)'));
        if (!closed && D > 2) svg.append(Line(tr[0][0], tr[0][1], e[0], e[1], 'var(--hl)', 2, { 'stroke-dasharray': '3 3' }), T(e[0] > 340 ? e[0] - 12 : e[0] + 12, Math.max(18, e[1] - 12), 'same spot, but the estimate disagrees', 'lbl', e[0] > 340 ? 'end' : 'start', { style: 'fill:var(--hl)' }));
        svg.append(T(W - 12, Hh - 10, 'dashed = true path, solid = estimate', 'axis', 'end'));
        out.innerHTML = ''; out.append(Chip('start-to-end gap', closed ? '0 px' : Math.round(D) + ' px', closed ? 'ok' : 'bad'), Chip('largest error along the path', Math.round(worst) + ' px', closed ? 'ok' : 'bad'));
      };
      body.append(svg, h('div.row', null, Seg([{ v: false, label: 'Without loop closure' }, { v: true, label: 'With loop closure' }], false, v => { closed = v; draw(); })), Slider({ label: 'drift over the lap', min: 0, max: 90, step: 1, value: D, fmt: v => v + ' px', on: v => { D = v; draw(); } }), out,
        h('p.cap', null, 'The estimate finishes away from where it started even though the robot walked back to the same spot. With loop closure the accumulated error gets spread across the whole loop. Here it’s spread linearly as a rough stand-in. Real pose graph optimization solves for every keyframe pose at once.')); draw();
    });
    return [
      H2('Drift'),
      P('Tracking makes a small error on every frame. From one frame to the next it’s tiny, but the errors add up. After five minutes of walking around a building the estimated path can be off by meters, and the map bends and warps because thousands of small errors have piled up. Pure frame-to-frame tracking, called visual odometry, drifts without limit.'),
      H2('Loop closure'),
      P('If the robot returns to a place it has already been and recognizes it, that gives you a strong constraint. If the map says the two visits are two meters apart, then about two meters of drift have built up and can be taken out.'),
      dr,
      H3('Recognizing a place you’ve been'),
      P('ORB-SLAM3 has a vocabulary of visual “words,” which are clusters of common descriptor patterns learned offline from lots of images. Any image can be summarized as a histogram of which words it contains, the way a document can be summarized by its word counts. To detect a loop, the system checks whether the current frame’s histogram closely matches the histogram of any old keyframe. That’s a fast database lookup rather than a pixel comparison, and it’s called bag of words. A strong match becomes a loop candidate.'),
      H3('Verifying and correcting'),
      P('A match can be a coincidence, like two hallways that look alike, so the system checks geometrically that the actual features line up. If they do, it computes the drift, meaning the difference between where the map thinks the robot is and where the loop says it is. Then it runs pose graph optimization. The trajectory is treated as a graph of keyframes connected by constraints, the loop constraint gets added, and the accumulated error is spread out across the whole loop. After a big loop closure it may also run a full global bundle adjustment.'),
      Real('If the map drifts and never corrects itself, loop closure probably isn’t triggering. That points to bag-of-words recognition, for instance a scene the vocabulary matches badly, or a route that never revisits anything.'),
      Check({ q: 'How does ORB-SLAM3 decide the robot has been somewhere before?', opts: ['It compares bag-of-words histograms of the current frame and old keyframes, then verifies geometrically', 'It compares every pixel of the current image against every old image', 'It uses GPS'], ans: 0, why: 'Histogram matching is a fast lookup, and the geometric check rejects look-alike places.' }),
      Check({ q: 'What does pose graph optimization do after a loop is confirmed?', opts: ['Adds the loop constraint and spreads the accumulated error across the loop', 'Deletes the old keyframes', 'Restarts tracking'], ans: 0, why: 'The map snaps back into consistency, and a warped hallway straightens out.' }),
    ];
  },
  cards: [
    { q: "What is drift and why does it happen?", a: "Each frame’s tracking has a tiny error and the errors accumulate. Frame-to-frame tracking (visual odometry) drifts without limit." },
    { q: "What does loop closure do?", a: "It recognizes that the robot has returned to a known place, measures the accumulated drift, and spreads that error through the whole trajectory." },
    { q: "How are revisited places recognized?", a: "<b>Bag of words</b>. Images get summarized as histograms of learned visual words and matched against old keyframes by a fast lookup, then verified geometrically." },
    { q: "What’s pose graph optimization?", a: "Treat the keyframes as a graph with constraints between them, add the loop-closure constraint, and spread the accumulated error across the loop." },
    { q: "The map drifts and never corrects. What’s the likely cause?", a: "Loop closure isn’t triggering, so bag-of-words recognition isn’t finding matches." },
  ],
});

/* 4 ─ objects, frames, TF */
lesson({
  id: 'p-frames', ch: 'see', mins: 9,
  title: "Objects, frames and TF",
  lede: "SLAM doesn’t detect objects. A detector does, and combining the two puts them in the map. The ROS TF tree then decides who publishes which part.",
  build() {
    const comp = Widget('Composing SLAM and the detector', body => {
      let rx = 190, ry = 70, hd = 40; const O = [470, 190], W = 660, Hh = 270, svg = svgRoot(W, Hh, { 'aria-label': 'Top view of a robot with a camera and a cube fixed in the map' }), out = h('div.readout'), Y = y => Hh - 20 - y;

        h('p.cap', null, 'The detector’s answer changes whenever the robot moves. Once it’s combined with the camera pose from SLAM, the object’s position in the map stays put.')); draw();
    });

    const tf = Widget('Two writers, two edges', body => {
      let tc = 6; const holder = h('div'), out = h('div.readout');
      const draw = () => {

        p.svg.append(Line(p.sx(tc), p.m.t, p.sx(tc), 230 - p.m.b, 'var(--hl)', 1.5, { 'stroke-dasharray': '3 3' }), T(p.sx(tc) + 6, p.m.t + 12, 'loop closure', 'lbl', 'start', { style: 'fill:var(--hl)' }),

      H2('From SLAM to objects'),
      P('SLAM gives you the robot’s position and a sparse point cloud. Objects come from a separate step. An object detector or pose estimator like FoundationPose runs on the camera image and reports that there’s a cube and what its 6-DOF pose is relative to the camera. SLAM reports the camera’s pose in the map. Compose the two transforms and you get the cube’s pose in the map frame.'),
      Eq('map → object  =  (map → camera)  ×  (camera → object)\n                     <span class="k">SLAM</span>            <span class="k">detector</span>'),

      H2('The TF tree'),

      P('SLAM doesn’t update at one fast, uniform rate. Tracking runs at camera rate, local mapping runs per keyframe and loop closing only fires occasionally. What SLAM publishes is one TF edge, map → odom, updated when it has a correction.'),
      P('State estimation (the fast IEKF and odometry) publishes odom → base_link at a high rate. That edge is smooth and accurate locally but drifts over time. The robot’s pose in the map is the composition of the two edges: fast smooth local motion plus a slow global correction.'),
      tf,
      P('The split is on purpose. Because odom → base_link is smooth and never jumps, a balance controller never sees the robot teleport. The slower map → odom gives global consistency and fixes drift, which is what navigation needs. When a loop closure fires, map → odom jumps and the local motion in the odom frame isn’t disturbed. This is the standard ROS convention (REP 105). There are two writers, each owning a different edge, so they never conflict.'),
      Check({ q: 'Which TF edge does SLAM publish?', opts: ['map → odom', 'odom → base_link', 'base_link → camera'], ans: 0, why: 'SLAM owns map → odom (the drift correction). State estimation owns odom → base_link. base_link → camera is static, from the mounting.' }),
      Check({ q: 'Why is odom → base_link kept separate from map → odom?', opts: ['Control needs motion that never jumps, while navigation needs global consistency that can jump when drift is corrected', 'ROS doesn’t allow more than one TF edge', 'To save bandwidth'], ans: 0, why: 'A loop closure only changes map → odom, so the balance controller running off odom never sees a discontinuity.' }),
      Check({ q: 'How does the cube’s position in the map get computed?', opts: ['Compose the camera’s pose in the map (SLAM) with the cube’s pose in the camera frame (detector)', 'The detector reports it directly in the map', 'SLAM labels the cube in its point cloud'], ans: 0, why: 'The detector only knows about the camera image. SLAM supplies the camera-to-map transform.' }),
    ];
  },
  cards: [
    { q: "How does an object end up in the map frame?", a: "Compose <b>map → camera</b> (from SLAM) with <b>camera → object</b> (from the detector). The result stays fixed as the robot moves." },
    { q: "What’s a semantic map or scene graph?", a: "The room as labeled objects with poses instead of anonymous points. It’s what the task planner reasons over." },
    { q: "Who owns which TF edge?", a: "<b>map → odom</b> belongs to SLAM (slow drift correction, jumps at loop closure). <b>odom → base_link</b> belongs to state estimation (fast, smooth, drifts). <b>base_link → camera</b> is static from the mounting." },
    { q: "Why split map → odom from odom → base_link?", a: "Control needs smooth motion that never jumps, and navigation needs global consistency. A loop closure only changes map → odom. This is REP 105." },
  ],
});

/* ── small simulations for the widgets ── */
function simTrack(kp, kd, hz) { // one leg joint following a policy that updates its target at `hz`, PD running at 1 kHz
  const I = .1, c = .02, dt = .001, N = 1000; let q = 0, w = 0; const qs = [], tg = [], rf = [];
  for (let i = 0; i <= N; i++) {
    const t = i * dt, r = .4 * Math.sin(2 * Math.PI * 1.5 * t), tk = Math.floor(t * hz + 1e-9) / hz, tgt = .4 * Math.sin(2 * Math.PI * 1.5 * tk);
    const tau = kp * (tgt - q) + kd * (0 - w);
    qs.push(q); tg.push(tgt); rf.push(r); w += (tau - c * w) / I * dt; q += w * dt;
  } return { qs, tg, rf };
}
function simArm(mode, kp, kd, err) { // one arm joint, horizontal at q = 0, gravity torque = mgl·cos(q)
  const I = .4, c = .3, mgl = 6, dt = .002, N = 1000; let q = mode === 'teach' ? .6 : 0, w = 0; const qs = [], ts = [];
  for (let i = 0; i <= N; i++) {
    const t = i * dt, qd = t >= .1 ? .6 : 0, gh = mode === 'pd' ? 0 : (1 + err) * mgl * Math.cos(q);
    const tau = mode === 'teach' ? gh : gh + kp * (qd - q) + kd * (0 - w);
    qs.push(q); ts.push(tau); w += (tau - mgl * Math.cos(q) - c * w) / I * dt; q = clamp(q + w * dt, -1.5, 1.5);
    if (q === -1.5 || q === 1.5) w = 0;
  } return { qs, ts };
}

      P('ros2_control, the EtherCAT driver and the drives are the transport. Libraries handle most of that, and the hardware chapter covers it. The control layer is the math that runs on top of that plumbing and makes the joints move where the policy asked. It’s its own piece of software, and the robot doesn’t work without it.'),

      Check({ q: 'Why do the arm and the legs get different controllers?', opts: ['The arm is in free space and needs a controller that knows its dynamics, while the leg policy already learned the dynamics in simulation', 'The arm motors are faster', 'The legs use a different network'], ans: 0, why: 'The leg policy was trained in a simulator with gravity and contact, so a plain PD is enough underneath it.' }),
      Check({ q: 'How much faster do the controllers run than the policies?', opts: ['About 10 to 40 times', 'About the same rate', 'About 1000 times'], ans: 0, why: 'Policies run at 50 to 100 Hz and the controllers at 1 to 2 kHz.' }),

    { q: 'Which controller does each side use?', a: '<b>Arm</b>: impedance control with gravity and Coriolis compensation. <b>Legs</b>: a plain fast PD controller.' },
    { q: 'What’s the rate structure of the control layer?', a: 'Policies output a target every 10-20 ms (50-100 Hz). The controllers run at 1-2 kHz, 10 to 40 times faster, using the latest target and the current joint state.' },

/* 2 ─ legs */

  cards: [

    { q: 'Why is a plain PD enough for the legs?', a: 'The policy was trained in a simulator with gravity, inertia and contact, so it already outputs targets that account for them. The compensation is in the weights. The legs are also in contact with the ground through the gait.' },

/* 3 ─ arm */
lesson({
  id: 'c-arm', ch: 'ctl', mins: 10,
  title: 'Arm: impedance control',
  lede: 'An arm sticks out into free space, so a plain spring toward the target sags under the arm’s own weight. The arm controller adds terms that come from the arm’s physics.',
  build() {
    const armW = Widget('Gravity compensation on one joint', body => {
      let mode = 'pd', kp = 60, kd = 8, err = 0; const holder = h('div'), out = h('div.readout');
      const draw = () => {
        const { qs, ts } = simArm(mode, kp, kd, err), n = qs.length, p = Plot(660, 230, { x: [0, 2], y: [-.5, 1], xt: [0, .5, 1, 1.5, 2], yt: [-.4, 0, .4, .8], xl: 'time (s)', yl: 'joint angle (rad)', m: { l: 48 } });
        const tgt = mode === 'teach' ? [[0, .6], [2, .6]] : [[0, 0], [.1, 0], [.1, .6], [2, .6]];
        p.svg.append(Path(path(tgt.map(a => [p.sx(a[0]), p.sy(a[1])])), 'var(--hl)', 2, 'none', { 'stroke-dasharray': '5 4' }), Path(path(qs.filter((_, i) => i % 4 === 0).map((v, i) => [p.sx(i * 4 * .002), p.sy(clamp(v, -.5, 1))])), 'var(--c)', 3),
          T(p.m.l + 8, p.m.t + 14, mode === 'teach' ? 'yellow: where you left it' : 'yellow: target', 'lbl', 'start', { style: 'fill:var(--hl)' }), T(p.m.l + 8, p.m.t + 30, 'colored: joint angle (0 = arm horizontal)', 'lbl', 'start', { style: 'fill:var(--c)' }));
        holder.innerHTML = ''; holder.append(p.svg);
        const end = qs[n - 1], dev = end - .6;
        out.innerHTML = ''; out.append(mode === 'teach' ? Chip('after 2 s', Math.abs(dev) < .02 ? 'holds in place' : (dev < 0 ? 'sinks ' : 'floats up ') + fx(Math.abs(dev), 2) + ' rad', Math.abs(dev) < .02 ? 'ok' : 'bad') : Chip('final error', fx(dev, 3) + ' rad', Math.abs(dev) > .03 ? 'bad' : 'ok'),
          Chip('gravity model', mode === 'pd' ? 'none' : err === 0 ? 'exact' : (err > 0 ? '+' : '') + Math.round(err * 100) + '% mass error', mode !== 'pd' && err !== 0 ? 'hl' : ''), mode === 'teach' ? Chip('Kp, Kd', '0, 0') : Chip('Kp, Kd', kp + ', ' + fx(kd, 1)));
      };
      body.append(holder, Seg([{ v: 'pd', label: 'PD only' }, { v: 'gc', label: 'Gravity compensation + PD' }, { v: 'teach', label: 'Teach mode' }], 'pd', v => { mode = v; draw(); }),
        Slider({ label: 'stiffness Kp', min: 0, max: 200, step: 1, value: kp, fmt: v => v, on: v => { kp = v; draw(); } }), Slider({ label: 'damping Kd', min: 0, max: 20, step: .5, value: kd, fmt: v => fx(v, 1), on: v => { kd = v; draw(); } }), Slider({ label: 'URDF mass error', min: -.5, max: .5, step: .05, value: err, fmt: v => (v > 0 ? '+' : '') + Math.round(v * 100) + '%', on: v => { err = v; draw(); } }), out,
        h('p.cap', null, 'PD only: the joint settles below the target because the spring has to carry the arm’s weight. Gravity compensation + PD: the arm’s weight is cancelled and the spring only does the moving. Teach mode: Kp = Kd = 0 and only the gravity term is left. With a correct model the arm holds wherever you leave it. With wrong inertials it sinks or floats. The model error slider changes the mass in the URDF that the controller believes.')); draw();
    });
    return [
      H2('Why plain PD isn’t enough'),
      P('Gravity pulls the arm down and there’s nothing to push against. Command “go to 45 degrees” with only a spring and the arm sags below 45, and the controller has to fight gravity constantly, which feels stiff and twitchy. The arm needs a richer control law, a sum of terms that each do one job.'),
      Eq([['τ = ', 'g(q)', 'gravity compensation'], ['  + ', 'C(q, q̇)·q̇', 'Coriolis'], ['  + ', 'Kp·(q_des − q)', 'position spring'], ['  + ', 'Kd·(q̇_des − q̇)', 'velocity damper'], ['  + ', 'barrier(q)', 'soft push away from joint limits']].map(([pre, term, note]) => pre + '<span class="k">' + term + '</span>' + ' '.repeat(Math.max(2, 26 - (pre + term).replace(/\u0307/g, '').length)) + note).join('\n')),
      UL('<b>g(q)</b> is the torque needed just to hold the arm up at this pose.', '<b>C(q, q̇)·q̇</b> covers the velocity-dependent forces when the arm moves fast.', '<b>Kp·(q_des − q)</b> is the spring pulling toward the target.', '<b>Kd·(q̇_des − q̇)</b> is the damper that prevents overshoot.', '<b>barrier(q)</b> is a soft repulsive push near the joint limits, for safety.'),
      P('Where each term comes from matters. Gravity and Coriolis are pure physics, so you don’t tune them. You compute them, exactly, from the arm’s dynamics model. Kp and Kd can’t be computed. You tune them by hand on the real hardware, watching for oscillation on one side and sluggishness on the other.'),

      Check({ q: 'Why does a plain spring sag an arm?', opts: ['The spring has to carry the arm’s weight, so a nonzero error remains', 'The damper is too weak', 'The policy is too slow'], ans: 0, why: 'At equilibrium Kp times the error equals the gravity torque, so the arm rests below the target.' }),
      Check({ q: 'Which terms are computed and which are tuned?', opts: ['Gravity and Coriolis are computed from the dynamics model, and Kp and Kd are tuned by hand', 'All four are tuned by hand', 'All four are computed'], ans: 0, why: 'Gravity and Coriolis are pure physics. Kp and Kd depend on the hardware and get tuned.' }),
      Check({ q: 'What does the barrier term do?', opts: ['Gives a soft repulsive push near the joint limits for safety', 'Cancels gravity', 'Damps velocity'], ans: 0, why: 'It keeps the arm away from its hard limits.' }),

  cards: [

    { q: 'Why does the arm need gravity compensation?', a: 'It’s in free space with gravity pulling it down. A plain spring sags below the target and fights gravity constantly.' },
    { q: 'Which arm terms are computed and which are tuned?', a: 'g(q) and C(q,q̇)q̇ are computed from the dynamics model. Kp and Kd are tuned by hand on the hardware.' },
    { q: 'What does the barrier term do?', a: 'A soft repulsive push near the joint limits, for safety.' },
  ],

/* 4 ─ tools, URDF, teach mode */
lesson({
  id: 'c-tools', ch: 'ctl', mins: 10,
  title: 'Pinocchio, CRISP and the URDF',
  lede: 'Gravity and Coriolis torques come from a dynamics library, and a controller that uses one already exists. What’s left for you is correct inertials, gains and a teach-mode test.',
  build() {
    const pathW = Widget('Two ways to get the arm controller', body => {
      let m = 'A'; const box = (t, d, strong) => h('div', { style: { border: '1px solid ' + (strong ? 'var(--c)' : 'var(--line)'), background: strong ? 'var(--c-soft)' : 'transparent', borderRadius: '8px', padding: '9px 13px' } }, h('b', { style: { fontSize: '14.5px' } }, t), d ? h('div', { style: { fontSize: '13px', color: 'var(--ink2)' } }, d) : null);
      const st = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } }), out = h('div.readout'), info = h('p.cap');
      const arrow = () => h('div.mono', { style: { textAlign: 'center', color: 'var(--ink3)' } }, '↓');
      const draw = () => {
        st.innerHTML = '';
        st.append(box('What you provide', m === 'A' ? 'the URDF with correct inertials, the Kp and Kd gains, and the position targets from the policy' : 'the URDF with correct inertials, the Kp and Kd gains, the position targets, and the controller code'), arrow());
        if (m === 'A') st.append(box('CRISP: a ready-made ros2_control controller', 'implements the whole law: gravity + Coriolis + Kp + Kd + barrier', true), h('div', { style: { marginLeft: '28px' } }, box('Pinocchio, inside it', 'RNEA gives g(q) and C(q, q̇)·q̇ from the URDF')));
        else st.append(box('Your own controller', 'a ros2_control controller you write: computes the law and writes efforts', true), h('div', { style: { marginLeft: '28px' } }, box('Pinocchio, called by your code', 'RNEA gives g(q) and C(q, q̇)·q̇ from the URDF')));
        st.append(arrow(), box('ros2_control effort interface', 'torque per arm joint'));
        out.innerHTML = ''; out.append(m === 'A' ? Chip('you write', 'config only', 'ok') : Chip('you write', 'a controller', 'hl'), m === 'A' ? Chip('recommended', 'yes, start here', 'ok') : Chip('use when', 'CRISP doesn’t fit'));
        info.textContent = m === 'A' ? 'CRISP is built for learning-based manipulation policies and teleoperation, which is this project’s exact use case. You never touch Pinocchio directly.' : 'More work and more to learn. Only worth it if CRISP can’t do what you need.';
      };
      body.append(Seg([{ v: 'A', label: 'Path A: adopt CRISP' }, { v: 'B', label: 'Path B: write your own' }], 'A', v => { m = v; draw(); }), st, out, info); draw();
    });
    return [
      H2('Where gravity and Coriolis come from'),
      P('You don’t derive the dynamics yourself. A dynamics library does it. Pinocchio is the modern one and KDL is the older, simpler one. You give Pinocchio the robot’s URDF and the current joint angles, and it runs an algorithm called RNEA (Recursive Newton-Euler) that returns g(q) and C(q, q̇)·q̇.'),
      Trap('Pinocchio is only as right as the inertial parameters in your URDF: the mass, center of mass and inertia tensor of every link. If those are wrong, or left as placeholder zeros, which happens a lot, the gravity compensation is garbage and no amount of gain tuning saves it. Getting them right is mechanical and CAD work upstream of the software, and it’s the real prerequisite.'),
      H2('Pinocchio and CRISP'),
      P('People often treat these as alternatives, but one lives inside the other. Pinocchio is only a math engine. It knows nothing about ROS or controllers. CRISP (and the Cartesian-Impedance-Controller it builds on) is a complete ros2_control controller that implements the whole sum of terms and calls Pinocchio internally for the gravity and Coriolis terms.'),
      pathW,
      P('So there are two paths. Path A is to adopt CRISP: give it your URDF, tune the gains, and never touch Pinocchio directly because it’s already in there. Path B is to write your own controller and call Pinocchio yourself, which is more work and more learning. Start with Path A and fall back to B only if CRISP doesn’t fit.'),
      H2('Tuning Kp and Kd'),
      P('Kp and Kd can’t be computed. You tune them by hand on real hardware, watching for oscillation versus sluggishness. It takes patience. Like the legs, the big proximal joints get stiff gains and the distal ones get soft gains.'),
      H2('Teach mode: the first milestone'),
      P('Before tuning a single gain, run the controller with gravity compensation only, so Kp = 0 and Kd = 0. If the URDF inertials are correct, the arm becomes weightless. You can grab it, move it anywhere by hand, let go, and it stays where you left it, holding against gravity with no sag. That one test checks your whole gravity model. If the arm sags or drifts, the inertials are wrong and you fix those before anything else.'),
      P('Teach mode is also how you hand-guide the arm to collect teleoperation demonstrations for the manipulation policy. The widget in the previous lesson has a teach-mode setting where you can see what a wrong mass does.'),
      Real('Do teach mode before any policy or gain tuning. It’s the cheapest test there is, and it fails loudly if the URDF is wrong.'),
      Check({ q: 'What does Pinocchio compute for the arm controller?', opts: ['g(q) and C(q, q̇)·q̇, from the URDF and the current joint angles, using RNEA', 'Kp and Kd', 'The policy’s targets'], ans: 0, why: 'Pinocchio is only the dynamics engine.' }),
      Check({ q: 'How are Pinocchio and CRISP related?', opts: ['CRISP is a full ros2_control controller that calls Pinocchio internally', 'They’re competing libraries', 'Pinocchio is a controller and CRISP is a URDF parser'], ans: 0, why: 'Adopting CRISP means never touching Pinocchio directly.' }),
      Check({ q: 'What does teach mode test?', opts: ['The URDF inertials, through the whole gravity model', 'The Kp and Kd values', 'The policy'], ans: 0, why: 'With Kp = Kd = 0 a correct model makes the arm weightless. Sagging or drifting means the inertials are wrong.' }),
    ];
  },
  cards: [
    { q: 'How do you get g(q) and C(q,q̇)q̇?', a: 'From a dynamics library (Pinocchio, or the older KDL). It takes the URDF and the joint angles and runs RNEA (Recursive Newton-Euler).' },
    { q: 'What does Pinocchio need to be correct?', a: 'The URDF’s inertial parameters: mass, center of mass and inertia tensor of every link. Placeholder zeros make gravity compensation garbage. Fixing them is upstream mechanical and CAD work.' },
    { q: 'How do Pinocchio and CRISP relate?', a: 'Pinocchio is only the math engine. CRISP is a complete ros2_control controller that implements the whole law and calls Pinocchio inside. Path A: adopt CRISP. Path B: write your own controller and call Pinocchio.' },
    { q: 'What’s teach mode and why do it first?', a: 'Run with gravity compensation only (Kp = Kd = 0). With correct inertials the arm is weightless and stays wherever you leave it. It validates the whole gravity model, and it’s how you hand-guide the arm for teleoperation demos.' },
  ],
});

/* 1 ─ Task planner */
lesson({
  id: 'b-planner', ch: 'plan', mins: 8,
  title: "Task planner",
  lede: "The planner turns a goal in plain language into an ordered list of skills the robot actually has. It runs once per goal.",
  build() {
    const SK = {
      navigate_to: { pre: [], post: ['at:X'], arg: true },
      pick: { pre: ['at:table', 'gripper:empty'], post: ['holding:cube', 'gripper:full'], arg: true },
      place: { pre: ['holding:cube'], post: ['gripper:empty', 'placed:cube'] },
    };
    const wid = Widget('Validate a plan against the skill library', body => {
      let plan = ['navigate_to(table)', 'pick(cube)', 'navigate_to(user)', 'place()']; const list = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } }), out = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } }), lib = h('div.readout');
      const all = ['navigate_to(table)', 'navigate_to(user)', 'pick(cube)', 'place()', 'fly_to(moon)', 'open_door(kitchen)'];
      const validate = () => {
        let world = new Set(['gripper:empty']), at = 'start'; const res = [];
        plan.forEach(step => {
          const nm = step.split('(')[0], arg = (step.match(/\((.*)\)/) || [])[1];
          if (!SK[nm]) { res.push({ step, ok: false, msg: 'not in the skill library, so the LLM made up a capability the robot doesn’t have' }); return; }
          const s = SK[nm], need = s.pre.filter(p => !(p === 'at:table' ? at === 'table' : world.has(p)));
          if (need.length) { res.push({ step, ok: false, msg: 'precondition not satisfied: ' + need.join(', ') }); return; }
          if (nm === 'navigate_to') at = arg; if (nm === 'pick') { world.delete('gripper:empty'); world.add('holding:cube'); world.add('gripper:full'); } if (nm === 'place') { world.delete('holding:cube'); world.delete('gripper:full'); world.add('gripper:empty'); world.add('placed:cube'); }
          res.push({ step, ok: true, msg: 'ok · world now: ' + [...world].concat(['at:' + at]).join(', ') });
        });
        return res;
      };
      const draw = () => {
        list.innerHTML = ''; plan.forEach((s, i) => list.append(h('div.row', { style: { gap: '8px' } }, h('span.chip', null, (i + 1)), h('code', { style: { flex: 1 } }, s), Btn('remove', () => { plan.splice(i, 1); draw(); }, 'ghost sm'))));
        const r = validate(); out.innerHTML = ''; r.forEach(x => out.append(h('div', { style: { fontSize: '14px', padding: '6px 10px', borderRadius: '8px', background: x.ok ? 'var(--ok-soft)' : 'var(--bad-soft)' } }, h('b', null, (x.ok ? '✓ ' : '✗ ') + x.step), h('div', { style: { color: 'var(--ink2)' } }, x.msg))));
        lib.innerHTML = ''; lib.append(Chip('plan', r.every(x => x.ok) && plan.length ? 'valid' : 'rejected: retry / replan', r.every(x => x.ok) && plan.length ? 'ok' : 'bad'));
      };
      const adders = h('div.row', null, ...all.map(a => Btn('+ ' + a, () => { plan.push(a); draw(); }, 'ghost sm')));
      body.append(h('p.cap', null, 'Goal: “bring me the cube from the table.” The list below is the LLM’s output. Remove steps, add steps, or add a skill that does not exist, and see what the validator reports.'), h('div.readout', null, Chip('skill library', 'navigate_to · pick · place'), Chip('pick needs', 'at table, gripper empty'), Chip('place needs', 'holding cube')), list, adders, out, lib, h('div.row', null, Btn('Reset to the LLM’s plan', () => { plan = ['navigate_to(table)', 'pick(cube)', 'navigate_to(user)', 'place()']; draw(); }, 'ghost'))); draw();
    });

    return [
      H2('From input to a string'),
      P('Voice goes through Whisper, which converts speech to text locally in a few hundred milliseconds. Typed text skips that step. Either way you end up with a string for the goal, published on /user_intent, and that wakes the planner up.'),
      H2('What the planner needs'),
      UL('<b>A skill library.</b> A YAML file you write once that defines every capability. Each skill lists its preconditions (what has to be true to start) and postconditions (what will be true when it finishes). The planner can only use skills that are in this file.', '<b>The current world state</b>, put together from live topics: robot pose (from the state estimator), object poses (from perception), gripper state and battery.', '<b>The language-model call</b>: the goal, world state and skill library go in, and a JSON list of skill calls comes out.'),
      P('Then you validate the JSON. Every skill has to exist and the preconditions have to chain from one step to the next. If the output is malformed you retry, and once it passes you publish it. For “bring me the cube” it looks like navigate_to(table) → pick(cube) → navigate_to(user) → place(). After that the planner goes back to sleep until a new goal shows up or something fails badly enough to need a replan.'),
      wid,
      Note('The skill library keeps the LLM to capabilities the robot really has, and the validator checks that each step’s preconditions are met by the postconditions of the steps before it.'),
      Check({ q: 'How often does the task planner run?', opts: ['Continuously at 20 Hz', 'Once per goal, then it sleeps unless a failure needs a replan', 'Once per second'], ans: 1, why: 'It isn’t a loop.' }),
      Check({ q: 'Why does the validator check preconditions and not only that the skill names exist?', opts: ['A plan can be made of real skills in an impossible order, like picking before navigating to the table', 'Because the LLM can’t spell', 'To speed up planning'], ans: 0, why: 'Chaining postconditions to preconditions is a cheap symbolic check.' }),
    ];
  },
  cards: [
    { q: "How often does the task planner run, and what does it produce?", a: "Once per goal (then it sleeps until a new goal or a failure that needs a replan). It produces an ordered list of skills as JSON." },
    { q: "What are the planner’s three inputs?", a: "The goal, the world state (robot pose, object poses, gripper, battery), and the skill library (YAML with preconditions and postconditions)." },
    { q: "What does validating the plan check?", a: "That every skill exists in the library and that preconditions chain from one step’s postconditions to the next. Retry if it’s malformed." },
    { q: "Where does voice input go?", a: "Through Whisper (local speech to text, a few hundred ms), then a string on /user_intent wakes the planner." },
  ],
});

/* 2 ─ Behavior tree */
lesson({
  id: 'b-bt', ch: 'plan', mins: 9,
  title: "Behavior tree",
  lede: "The behavior tree carries out the plan. It re-checks safety on every tick, so it can abort a bad motion within one tick.",
  build() {
    const wid = Widget('Tick the tree', body => {
      let battery = true, upright = true, fault = false, navFail = false, tick = 0, step = 0, prog = 0, retries = 0, status = 'RUNNING', timer = null, running = true, log = [];
      const skills = ['navigate_to(table)', 'pick(cube)', 'navigate_to(user)', 'place()'];
      const view = h('div'), logEl = h('div.eq', { style: { minHeight: '92px', whiteSpace: 'pre-wrap' } }), out = h('div.readout');
      const node = (t, s, indent, extra) => h('div', { style: { marginLeft: indent * 22 + 'px', display: 'flex', gap: '8px', alignItems: 'center', padding: '5px 10px', borderRadius: '8px', border: '1px solid var(--line)', background: s === 'FAILURE' ? 'var(--bad-soft)' : s === 'RUNNING' ? 'var(--c-soft)' : s === 'SUCCESS' ? 'var(--ok-soft)' : 'var(--surface)', fontSize: '14px' } }, h('b', null, t), s ? h('span.chip', { style: { marginLeft: 'auto' } }, s) : null, extra || null);
      const say = m => { log.unshift('tick ' + tick + ': ' + m); log = log.slice(0, 5); };
      const step1 = () => {
        tick++;
        const guards = [['battery ok', battery], ['upright', upright], ['no faults', !fault]], bad = guards.find(g => !g[1]);
        if (bad) { status = 'ABORTED'; say('guard “' + bad[0] + '” failed → ReactiveSequence aborts, action cancelled this tick'); render(); return; }
        if (step >= skills.length) { status = 'SUCCESS'; say('plan complete'); running = false; render(); return; }
        status = 'RUNNING';
        if (navFail && skills[step].startsWith('navigate')) { retries++; if (retries > 3) { status = 'REPLAN'; say('retries used up, so the failure goes up to the planner for a full replan'); running = false; } else say('nav failed → recovery: clear costmap and retry (' + retries + '/3)'); render(); return; }
        prog += 12 + (step % 2) * 6; say('ticking ' + skills[step] + ' (RUNNING, ' + Math.min(100, prog) + '%)');
        if (prog >= 100) { say(skills[step] + ' SUCCESS'); step++; prog = 0; retries = 0; }
        render();
      };
      const render = () => {
        view.innerHTML = '';
        view.append(node('Root · ReactiveSequence', status === 'ABORTED' ? 'FAILURE' : status === 'SUCCESS' ? 'SUCCESS' : 'RUNNING', 0, null));
        [['battery ok', battery], ['upright', upright], ['no faults', !fault]].forEach(g => view.append(node('Condition: ' + g[0], g[1] ? 'SUCCESS' : 'FAILURE', 1)));
        skills.forEach((s, i) => view.append(node('Action: ' + s, i < step ? 'SUCCESS' : i === step && status !== 'ABORTED' && status !== 'SUCCESS' ? (status === 'REPLAN' ? 'FAILURE' : 'RUNNING') : '', 1)));
        logEl.textContent = log.join('\n') || 'press Start';
        out.innerHTML = ''; out.append(Chip('tick', tick, 'c'), Chip('rate', '20 Hz = every 50 ms'), Chip('status', status, status === 'ABORTED' || status === 'REPLAN' ? 'bad' : status === 'SUCCESS' ? 'ok' : ''));
      };
      const start = () => { clearInterval(timer); timer = setInterval(() => { if (status === 'ABORTED' || !running) return; step1(); }, 300); };
      onLeave(() => clearInterval(timer));
      const tgl = (id, lab, get, set) => h('label', { style: { display: 'inline-flex', gap: '6px', alignItems: 'center', fontSize: '14px' } }, h('input', { type: 'checkbox', id, checked: get() ? '' : null, on: { change(e) { set(e.target.checked); render(); } }, style: { accentColor: 'var(--c)' } }), lab);
      body.append(h('div.row', null, tgl('bt-bat', 'Battery OK', () => battery, v => { battery = v; }), tgl('bt-up', 'Upright', () => upright, v => { upright = v; }), tgl('bt-fault', 'Inject fault', () => fault, v => { fault = v; }), tgl('bt-nav', 'Navigation keeps failing', () => navFail, v => { navFail = v; })),
        h('div.row', null, Btn('Start / restart', () => { tick = 0; step = 0; prog = 0; retries = 0; status = 'RUNNING'; running = true; log = []; start(); render(); }), Btn('Pause', () => clearInterval(timer), 'ghost')), view, logEl, out, h('p.cap', null, 'Ticks are slowed down (the real rate is every 50 ms). Untick “Battery OK” while it runs and the guard at the top fails on the next tick, cancelling the running action. Turn on “Navigation keeps failing” to see recovery escalate to a replan.')); render();
    });

    return [
      H2('How it works'),
      UL('<b>Ticking.</b> The whole tree gets evaluated from the root down 20 times a second, and every node returns SUCCESS, FAILURE or RUNNING.', '<b>ReactiveSequence.</b> Safety guards (battery, upright, faults) sit at the top and get re-checked on every tick. If something goes wrong partway through an action, the tree can abort within one tick instead of finishing a motion that no longer makes sense.', '<b>The blackboard.</b> Shared memory that ROS subscribers keep updated: robot pose at 500 Hz, object poses at 30 Hz, gripper state, battery. Condition nodes read it in microseconds and never have to make a slow call.', '<b>Action nodes.</b> These are the long-running skills. Each one is a client of a ROS action server that works asynchronously, sends feedback and can be cancelled. When the tree ticks “navigate to table” it sends a goal and gets RUNNING back while the robot moves.'),
      P('Navigation skills go to Nav2, which ends in /cmd_vel and the locomotion policy. Pick and place skills go to the manipulation side and its arm policy. The two policies run side by side, each fed by its own kind of skill.'),
      P('Each skill is also wrapped in recovery. If it fails, a recovery routine runs (clear the costmap and retry for navigation, re-detect the object and retry for grasping), and only when the retries run out does the failure go up to the planner for a full replan.'),
      wid,
      Trap('Don’t confuse the task planner with the behavior tree. The planner reasons once and produces the plan. The tree runs all the time, executes that plan, watches safety and handles failures.'),
      Order({ q: 'A navigation skill keeps failing. Put the escalation in order.', items: ['The skill fails', 'A recovery routine runs: clear the costmap and retry', 'The retries run out', 'The failure goes up to the task planner', 'The planner replans and publishes a new skill sequence'], why: 'The slow, expensive layer only gets used after the fast, cheap one runs out of options.' }),
      Check({ q: 'The battery drops below the safe threshold in the middle of a pick. How soon does the tree react?', opts: ['After the pick finishes', 'Within one tick, since the guards are re-checked every tick', 'When the planner next runs'], ans: 1, why: 'That’s what a ReactiveSequence does.' }),
      Check({ q: 'What’s the blackboard?', opts: ['A log of failures', 'Shared memory kept fresh by ROS subscribers, so conditions can read pose, objects, gripper and battery immediately', 'The skill library'], ans: 1, why: 'Subscribers update it at their own rates.' }),
    ];
  },
  cards: [
    { q: "What does ReactiveSequence do?", a: "It re-checks the safety guards at the top of the tree on every tick, so a bad action gets aborted within one tick." },
    { q: "What’s the behavior tree’s tick rate and what do nodes return?", a: "20 Hz. Each node returns SUCCESS, FAILURE or RUNNING." },
    { q: "What’s the blackboard?", a: "Shared memory kept fresh by ROS subscribers (pose 500 Hz, objects 30 Hz, gripper, battery), so conditions read state in microseconds." },
    { q: "How do action nodes work?", a: "Each is a client of a ROS action server. It’s asynchronous, sends feedback and can be cancelled. It returns RUNNING while the skill executes." },
    { q: "What’s the failure escalation order?", a: "The skill fails, recovery and retry, retries run out, the failure goes up to the planner, and it does a full replan." },
  ],
});

/* 4 ─ ros2_control & EtherCAT */
lesson({
  id: 'b-ros2c', ch: 'hw', mins: 8,
  title: "ros2_control",
  lede: "The control layer produces torque commands, and ros2_control is the framework that runs those controllers and connects them to the drives.",
  build() {
    const loopW = Widget('The 1 kHz loop', body => {
      let phase = -1, timer = null, cycles = 0; const stages = [['1 · READ', 'state up from hardware: actual position, velocity, torque', 'state interfaces'], ['2 · UPDATE', 'active controllers compute new commands (PD gains per joint)', 'controllers'], ['3 · WRITE', 'commands down to hardware: target torque', 'command interfaces']];
      const row = h('div.grid2', { style: { gridTemplateColumns: 'repeat(auto-fit,minmax(min(100%,190px),1fr))' } }), out = h('div.readout');
