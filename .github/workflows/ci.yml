name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, no ROS: interface contract vs code, generated docs, links, robot profiles / manifests,
  # and the pure-Python unit tests of each ROS package. Docs-only changes still run this job
  # (link, anchor and generated-doc checks) but skip the ROS job below.
  static:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/changed-files.txt"
          if ! git diff --name-only "$BASE_SHA"..HEAD > "$changed"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            case "$file" in
              *.md|docs/*) ;;
              *) docs_only=false; break ;;
            esac
          done < "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinocchio 3+ (the arm toolkit's API) is only on pip with NumPy 2, so this job runs NumPy 2; the ros job below
      # covers the ROS image's NumPy 1.26. mcap, fastapi, httpx and uvicorn let the logging and perception-link tests run.
      - run: pip install pytest pyyaml opencv-python-headless "pin>=3" scipy "mujoco==3.11.0" pyarrow mcap fastapi httpx uvicorn
      - name: Generated docs are up to date
        run: python tools/gen_docs.py --check
      - name: Contract, consistency and unit tests
        run: python -m pytest -q tests ros2_ws/src/*/test training/sim2real manipulation/finetune

  # Real ROS 2 Jazzy in the same container the stack is developed in (infra/docker): build the
  # workspace, then bring up the stub stack and the MuJoCo + policy stack, check each against the
  # live interface contract and drive them.
  # docs-only changes: static still checks links, anchors and generated docs; this job adds nothing for them.
  # A job-level `if` reports Success when skipped, so it stays safe if these jobs become required checks.
  ros:
    runs-on: ubuntu-latest
    needs: static
    if: needs.static.outputs.docs_only != 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build the ROS image
        run: docker build -t hsim/ros-jazzy:dev infra/docker
      # Wisco V1 (the default robot) has no lidar: its stereo camera renders a built environment, so the test room
      # is built first (the same tools/env_build.py the Mac uses; previews skipped). The G1 also runs in the bare world.
      - name: colcon build + stack smoke tests (stub; Wisco V1 in the test room; G1 in the bare world; Wisco on the ros2_control and ethercat_sim backends)
        run: |
          docker run --rm --shm-size=1g -e MUJOCO_GL=osmesa -e ROS_DOMAIN_ID=42 \
            -e ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST \
            -v "$PWD":/hsim -w /hsim/ros2_ws hsim/ros-jazzy:dev bash -c '
              source /opt/ros/jazzy/setup.bash &&
              colcon build --symlink-install --event-handlers console_cohesion+ &&
              source install/setup.bash &&
              (cd /hsim && python3 tools/env_build.py assets/envs/test/table_room --robot wisco --no-render) &&
              colcon test --packages-select wisco_ethercat_ros2_hw hsim_mujoco_plugins --event-handlers console_cohesion+ &&
              colcon test-result --verbose &&
              STACK=stub /hsim/tools/stack_smoke_test.sh &&
              STACK=sim ENV=test/table_room /hsim/tools/stack_smoke_test.sh &&
              STACK=sim ROBOT=g1 /hsim/tools/stack_smoke_test.sh &&
              STACK=sim BACKEND=ros2_control ENV=test/table_room /hsim/tools/stack_smoke_test.sh &&
              STACK=sim BACKEND=ethercat_sim ENV=test/table_room /hsim/tools/stack_smoke_test.sh'
