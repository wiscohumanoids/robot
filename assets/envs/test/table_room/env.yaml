# Environment definition, read by tools/env_build.py
name: test/table_room
description: 8 x 6 m room with a table (three colored blocks on it), couch, shelf, and an ottoman.
robot_world: assets/robots/g1/mjlab_1.6.0/g1_velocity_flat.xml
room: room.xml
spawn: {x: -3.0, y: 0.0, yaw_deg: 0.0}        # G1 starts at the west end, facing the table
map:
  resolution: 0.05                             # m per cell
  bounds: {xmin: -4.2, xmax: 4.2, ymin: -3.2, ymax: 3.2}
  min_obstacle_height: 0.05                    # anything taller than this blocks walking
objects:                                       # named things the planner / perception can refer to
  - {name: table,       class: table,   body: table}
  - {name: red_block,   class: block,   body: red_block}
  - {name: green_block, class: block,   body: green_block}
  - {name: blue_block,  class: block,   body: blue_block}
  - {name: couch,       class: couch,   body: couch}
  - {name: shelf,       class: shelf,   body: shelf}
  - {name: ottoman,     class: ottoman, body: ottoman}
