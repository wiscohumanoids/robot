# Joint config for arm01, the 7 DOF test arm.
#
# One per arm, checked in, changes rarely. The hardware fields are the
# MyActuator V4 datasheet values (sources in config/actuator_models.yaml);
# bench tests confirm or correct them. A field set to null falls back to
# the actuator model table and the code says so.
#
# max_torque_nm / max_vel_rad_s are the RT controller's per-joint clamps, and
# every calibration stage scales its excitation from them (PACE chirps run to
# 0.7 x max_vel). Each joint uses its model peak torque as the command ceiling.
# Continuous ratings are listed separately in config/actuator_models.yaml.
#
# Read by both sides: the launch file (bus positions, models, directions ->
# EtherCAT slave configs and the ros2_control block) and arm_stack (units,
# limits, gains). Joint names match robots/arm01/urdf/arm01.urdf.
#
# bus_position: physical place on the ring, 0 = first drive after the master
#   (the EtherCAT slave index, minus one).
# direction: +1 if a positive drive count moves the joint positively about its
#   URDF axis. `arm bringup` checks it and reports a mismatch.

arm: arm01
urdf: ../urdf/arm01.urdf          # relative to this file
bus: {iface: enp3s0, cycle_us: 1000, dc_sync: true}

# Resting pose every stage starts from and returns to (rad, 3 deg inside the limits
# when used). The URDF's q = 0 is the arm stretched out forward, its worst gravity
# load; this is the upper arm hanging (J1 +90 deg) with the elbow bent 45 deg, which
# keeps the peg tip 10 cm above the stand's base plate (fully hanging, it is level with
# the plate) at under 30% of any clamp. Also the zeroing jig pose unless `jig_pose_rad`
# is given.
home_pose_rad:
  shoulder_pitch: 1.5708
  shoulder_roll: 0.0
  shoulder_yaw: 0.0
  elbow: 0.7854
  forearm_yaw: 0.0
  wrist_pitch: 0.0
  wrist_yaw: 0.0

# velocity (CSV), effort (CST), or arm (CSP + CST with runtime switching:
# Mode P / Mode T; needs the ArmController).
control_mode: arm

joints:
  - name: shoulder_pitch      # J1, ROM -90..+180 deg (operating range; stops unverified)
    bus_position: 0
    model: x6_60
    direction: 1
    gear_ratio: 19.612  # datasheet
    counts_per_rev: 131072  # 0x6064 per output rev (verify: arm indicator)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 9.5  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    use_peak_torque_limit: true
    max_torque_nm: 60.0
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 153 rpm = 16.0 rad/s)
    gains: {kp: 60.0, kd: 2.0}
  - name: shoulder_roll       # J2, ROM 0..+190 deg
    bus_position: 1
    model: x6_60
    direction: 1
    gear_ratio: 19.612  # datasheet
    counts_per_rev: 131072  # 0x6064 per output rev (verify: arm indicator)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 9.5  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    use_peak_torque_limit: true
    max_torque_nm: 60.0
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 153 rpm = 16.0 rad/s)
    gains: {kp: 60.0, kd: 2.0}
  - name: shoulder_yaw        # J3, ROM -90..+90 deg
    bus_position: 2
    model: x4_36
    direction: 1
    gear_ratio: 36  # datasheet
    counts_per_rev: 131072  # 0x6064 per output rev (verify: arm indicator)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 6.1  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    use_peak_torque_limit: true
    max_torque_nm: 34.0
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 83 rpm = 8.7 rad/s)
    gains: {kp: 30.0, kd: 1.0}
  - name: elbow               # J4, ROM 0..+130 deg
    bus_position: 3
    model: x4_36
    direction: 1
    gear_ratio: 36  # datasheet
    counts_per_rev: 131072  # 0x6064 per output rev (verify: arm indicator)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 6.1  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    use_peak_torque_limit: true
    max_torque_nm: 34.0
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 83 rpm = 8.7 rad/s)
    gains: {kp: 30.0, kd: 1.0}
  - name: forearm_yaw         # J5, ROM -90..+90 deg
    bus_position: 4
    model: x4_10
    direction: 1
    gear_ratio: 12.5  # datasheet
    counts_per_rev: 131072  # 0x6064 per output rev (verify: arm indicator)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 7.8  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    use_peak_torque_limit: true
    max_torque_nm: 10.0
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 238 rpm = 24.9 rad/s)
    gains: {kp: 20.0, kd: 0.6}
  - name: wrist_pitch         # J6, ROM -35..+35 deg
    bus_position: 5
    model: x4_10
    direction: 1
    gear_ratio: 12.5  # datasheet
    counts_per_rev: 131072  # 0x6064 per output rev (verify: arm indicator)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 7.8  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    use_peak_torque_limit: true
    max_torque_nm: 10.0
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 238 rpm = 24.9 rad/s)
    gains: {kp: 10.0, kd: 0.3}
  - name: wrist_yaw           # J7, ROM -90..+90 deg
    bus_position: 6
    model: x4_10
    direction: 1
    gear_ratio: 12.5  # datasheet
    counts_per_rev: 131072  # 0x6064 per output rev (verify: arm indicator)
    encoder_side: output  # dual absolute encoder, 0x6064 output-referred (verify)
    rated_current_a: 7.8  # datasheet rms; 0x6075 holds the drive value (read over SDO)
    use_peak_torque_limit: true
    max_torque_nm: 10.0
    max_vel_rad_s: 2.0  # bring-up clamp (datasheet rated 238 rpm = 24.9 rad/s)
    gains: {kp: 10.0, kd: 0.3}

# Weighed at assembly, one per link (kg). null: the URDF's placeholder mass is used.
link_masses_kg:
  link1: null
  link2: null
  link3: null
  link4: null
  link5: null
  link6: null
  link7: null

# Flange marker cluster for arm mocap-calib / mocap-repeat / validate.
# topic: geometry_msgs/PoseStamped of the cluster in the mocap frame (null: no mocap), e.g.
#   /vrpn_mocap/<rigid body name>/pose from `ros2 launch wisco_ethercat_ros2_hw mocap.launch.py`.
# length_bar_error_m: absolute error from the calibrated length bar moved through the
#   workspace; it caps the accuracy any fit can reach (pass = 2x this).
mocap:
  topic: null
  length_bar_error_m: null

# Optional fixed validation poses (rad, 7 per pose). Empty: feasible random poses.
validation:
  # ISO 9283 poses on the 135 mm cube at (0.170, -0.490, 0.210) from tools/workspace_map.py
  # (regenerate with wisco_ethercat_ros2_hw/tools/workspace_map.py): one tool orientation, cond 15-51, >= 9 deg from every
  # joint limit, inside the 60% gravity-torque rule
  iso_poses_rad:
    - [1.1880, 0.8057, -1.2019, 1.6012, 0.4256, -0.1592, 0.6836]
    - [2.0606, 1.1007, -0.9049, 1.3537, -0.5233, 0.4523, 1.0797]
    - [2.0615, 0.7064, -0.9924, 2.1190, -0.0901, 0.4507, 0.5655]
    - [0.4698, 0.6411, -1.2647, 1.6129, 1.1595, -0.4261, 0.8255]
    - [0.5158, 1.2108, -1.3595, 0.6498, 1.0903, -0.1021, 1.1362]

# Divot plate for `arm plate`: kinematic calibration without mocap. The probe tip
# (tool0) is hand guided into each divot in several configurations; the fit uses the
# plate's known divot spacing as its length scale.
# PLACEHOLDER GEOMETRY: every number below needs the plate drawing (needs_drawing: true
# makes `arm plate` flag it on hardware until it is replaced).
plate:
  needs_drawing: true
  # divot seat centres in the plate frame (m): origin at divot 0, x along the first row,
  # z out of the top face, at the height where the probe tip seats in a divot
  divots_m:
    - [0.000, 0.000, 0.0]
    - [0.100, 0.000, 0.0]
    - [0.200, 0.000, 0.0]
    - [0.000, 0.075, 0.0]
    - [0.100, 0.075, 0.0]
    - [0.200, 0.075, 0.0]
    - [0.000, 0.150, 0.0]
    - [0.100, 0.150, 0.0]
    - [0.200, 0.150, 0.0]
  tolerance_mm: 0.02         # divot position tolerance on the drawing
  held_out: [4, 8]           # divots kept out of the fit, to validate it
  approach_cone_deg: 60      # probe axis within this angle of the plate normal (clearance)
  fit_tip: true              # fit a probe-tip offset; stored folded into J7's zero and origin
                             # (its radial part is only reported). false: URDF tool0 as is
  # rough plate frame in base_link (xyz m, rpy rad): sim placement and operator hint
  # only; the fit finds the real pose
  pose_in_base: {xyz: [0.15, -0.375, -0.40], rpy: [0.0, 0.0, 0.0]}

# Dial-indicator cube for repeatability without mocap (`arm repeat --indicators`,
# `arm validate` without mocap). Three orthogonal indicators on a stand touch three
# faces of a cube bolted to the flange, one ISO pose per fixture setup.
# PLACEHOLDERS until the fixture is built.
indicator_cube:
  cube_size_m: 0.04                        # ground cube on the flange
  center_in_flange_m: [0.0, 0.0, 0.025]    # cube centre in the flange frame
  # indicator axes in base_link, one row each (unit, orthogonal): a reading grows
  # when the cube face moves along the row (the indicator sits on that side)
  axes_in_base: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
  resolution_m: 1.0e-6                     # 0.001 mm digital indicators
  range_m: 0.0127                          # plunger travel; set at mid travel when zeroing
  serial: {port: null, baud: 9600}         # digital indicators over USB (stub); null: type them
