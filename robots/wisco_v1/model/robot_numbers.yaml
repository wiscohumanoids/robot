      value: 0.13
      upper_bound: 0.26
      source: 'derived: half of upper bound (V*I_noload/w_noload - backdrive)/w_noload'
    status_note: Characteristic curve on the X8-150 page is labelled 'X8-P20-120' (a different motor), so it is not used. Listed under 'V4.1 Special
      Series For Robot'.
joint_to_motor:
  _note: 'Single motors: joint = motor. Linkage joints (ankles: 2x X4-36, waist roll/pitch: 2x X6-60) are mapped through the linkage Jacobian
    J (motor angle per joint angle) at the zero pose: armature and viscous damping add as sum(J^2 * motor value), Coulomb friction and torque
    as sum(|J| * motor value), speed as motor speed / max |J|.'
  X8-150:
  - left_hip_pitch
  - left_hip_roll
  - left_knee
  - right_hip_pitch
  - right_hip_roll
  - right_knee
  - torso_yaw
  X6-60:
  - left_hip_yaw
  - right_hip_yaw
  - left_shoulder_pitch
  - left_shoulder_roll
  - right_shoulder_pitch
  - right_shoulder_roll
  X4-36:
  - left_shoulder_yaw
  - left_elbow
  - left_forearm_yaw
  - right_shoulder_yaw
  - right_elbow
  - right_forearm_yaw
  X4-10:
  - head_yaw
  - head_pitch
  - left_wrist_pitch
  - left_wrist_roll
  - right_wrist_pitch
  - right_wrist_roll
  linkage_2x_X4-36:
  - left_ankle_pitch
  - left_ankle_roll
  - right_ankle_pitch
  - right_ankle_roll
  linkage_2x_X6-60:
  - torso_roll
  - torso_pitch
delay:
  command_delay_ms:
    range:
    - 0
    - 10
    source: 'estimate from published measurements: PACE (ETH) identified 7.5 ms on ANYmal/Tytan; Menlo measured 0-9 ms staleness across their
      CAN read order. Replace with the measured value from bench tests / bus timing.'
