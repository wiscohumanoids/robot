    hip_pitch:
      kp: 120
      kd: 11.34
      I_eff_home: 1.0722
      rp1_kd: 7.5
    hip_roll:
      kp: 120
      kd: 10.6
      I_eff_home: 0.9372
      rp1_kd: 7.5
    knee:
