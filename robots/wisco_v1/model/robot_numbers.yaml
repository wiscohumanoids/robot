_about: 'All numbers for the Wisco V1 sim in one file. Every value has a source. ''datasheet'' = MyActuator official parameter sheet (images in
  motor_datasheets/). ''derived'' = computed from datasheet values. ''estimate'' = not measured yet (bench tests / PACE / weighing will replace
  it). ''decision'' = a choice we made. To change a number: edit it here (value + source), then run sync_robot_folder.py and build_training_model.py,
  rerun the checks (checks/run_checks.py), retrain.'
