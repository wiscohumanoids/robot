masses:
  _about: Measured or better link masses (hardware_observations.md, Masses). Each entry replaces that link's mass and scales its inertia by the same factor;
    'com' (m, link frame) optional. Empty until there is real data.
  _example:
    left_knee_link:
      mass_kg: 2.25
      com:
      - 0.0
      - 0.0
      - -0.12
      source: weighed on a scale, +/-5 g
  overrides: {}
control:
  modes:
    legs_waist_head: 'MyActuator EtherCAT mode 5 (PVT/MIT): position target + kp/kd per cycle, PD on the driver'
    arms: 'MyActuator EtherCAT CSP with a gravity torque offset (0x60B2), or CST torque: the arm controller (gravity compensation + PD)'
    source: decision (hardware_observations.md, Drive mode, gains and delay)
  gains_source: 'decision: RP1-style kp (hips/knee 120, hip yaw 50, ankles 35 joint space, waist 100; arms in sim ~RP1 arm values as
    a stand-in for the controls stack). kd = 2*zeta*sqrt(kp*I_eff) with zeta = 0.5, I_eff = joint inertia at the home pose with the base fixed
    (armature + limb). Critical damping (zeta 1) on swing-limb inertia gives hips kd 21-24, 3x RP1''s 7.5, and would use most of the motor torque
    at walking speeds; zeta 0.5 lands near RP1''s kd (rp1_kd for comparison). Keys apply to left_ and right_ joints.'
