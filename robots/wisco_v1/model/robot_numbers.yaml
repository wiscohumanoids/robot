        X8-family listings: X8 0.805, X8 Pro 1.45, X8-120 1.5 kg.cm2 (distributor pages). Nominal 1.2 sits between the typo-corrected
        1.02 and 1.5; training randomizes 0.8-2.0. Confirm with MyActuator (hardware_observations.md, Rotor inertia).'
