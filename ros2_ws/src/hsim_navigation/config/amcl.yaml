# AMCL: localize on a KNOWN map (the env's geometry map) by matching lidar scans.
# Node name `localization` (owns map -> odom). Initial pose: set by the launch file
# from the env's spawn pose, as an operator would give it.
localization:
  ros__parameters:
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: "nav2_amcl::OmniMotionModel"   # a humanoid can sidestep
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: "likelihood_field"
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    min_particles: 300
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.1
    update_min_a: 0.1
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 0.5
    do_beamskip: false
    set_initial_pose: true
