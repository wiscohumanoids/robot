# Job queue for the GPU VM, read by infra/vm_jobs/vmjobs.py (from the laptop: tools/dev/vm.sh jobs <command>).
# Add a job here, sync the repo (tools/dev/vm.sh sync), then launch it. Each job writes to ~/hsim_runs/<job id>/.
#
# Placeholders in command / env / report values:
#   {repo}     the repo copy on the VM (defaults.repo)   {log_root}  ~/hsim_runs/<job id>
#   {runs}     ~/hsim_runs                              {data}      ~/hsim_data       {envs}  ~/hsim_envs
# kind: rl       -> mjlab / RSL-RL training: status parses the training output; `resume` appends
#                   --agent.resume True --agent.load-run <latest run dir>; the morning report exports and plays it.
#       service  -> long-running server (status shows its last line).
#       step     -> one-shot step of a pipeline (data generation, conversion, fine-tuning).
# enabled: false -> skipped by launch-all.
# auto_resume: n -> after a crash (nonzero exit that wasn't a `stop`), relaunch with resume arguments up to n times.
# depends_on: the job waits (polling every 30 s) until each listed job has exited with code 0; if one of them fails
#             or is stopped, this job is marked "blocked" and does not run.
# gpu_mem_gb: GPU memory the job needs; launch refuses when less is free.

defaults:
  repo: ~/robot
  runs: ~/hsim_runs
  data: ~/hsim_data
  envs: ~/hsim_envs
  env:
    MUJOCO_GL: egl
    WANDB_MODE: offline
    PYTHONUNBUFFERED: "1"
    PATH: "~/.local/bin:{PATH}"          # uv is installed in ~/.local/bin
    HF_HOME: "~/hsim_data/hf-cache"

jobs:
  wisco_velocity:
    description: Wisco V1 walking policy, arms-free recipe (legs + waist; arms held), 4096 envs
    kind: rl
    workdir: "{repo}/training/locomotion"
    command: "bash wisco_v1/vm/train_velocity.sh --log-root {log_root}"
    gpu_mem_gb: 12
    auto_resume: 1
    report:
      venv: "{repo}/training/locomotion/.venv"
      task: Wisco-V1-Velocity-Flat
      import_path: "{repo}/training/locomotion/wisco_v1"
      import_module: wisco_mjlab

  g1_velocity_arms_free:
    description: G1 walking policy, arms-free recipe (legs + waist; scripted arm motion)
    kind: rl
    workdir: "{repo}/training/locomotion"
    command: "bash scripts/train_g1_velocity_arms_free.sh --log-root {log_root}"
    gpu_mem_gb: 12
    auto_resume: 1
    report:
      venv: "{repo}/training/locomotion/.venv"
      task: Hsim-G1-Velocity-Flat-ArmsFree
      import_path: "{repo}/training/locomotion"
      import_module: hsim_tasks

  wisco_tracking_dance:
    description: Wisco V1 motion tracking on one retargeted LAFAN1 clip (dance1_subject2)
    kind: rl
    enabled: false
    workdir: "{repo}"
    command: "bash training/tracking/wisco_v1/train_wisco_tracking.sh dance1_subject2 --log-root {log_root}"
    gpu_mem_gb: 12

  manipulation_groot_finetune:
    description: GR00T fine-tune on the humanoid pick-and-place dataset in {data}/manip/<version>/lerobot
    kind: step
    enabled: false
    workdir: "{repo}/training/manipulation"
    command: "bash groot/finetune.sh v1"
    gpu_mem_gb: 40
