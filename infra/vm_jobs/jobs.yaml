# Overnight jobs on the GPU VM (hsim-gpu), 2026-11-10. Read by tools/vm_jobs.sh (infra/vm_jobs/vmjobs.py).
#
# Placeholders in command / env / report values:
#   {repo}     ~/humanoid-sim-stack          {log_root}  ~/hsim_runs/<job id>
#   {runs}     ~/hsim_runs                   {data}      ~/hsim_data       {envs}  ~/hsim_envs
# kind: rl       -> mjlab/rsl_rl training: status parses rsl_rl output; `resume` appends
#                   --agent.resume True --agent.load-run <latest run dir>; morning report exports/plays it.
#       service  -> long-running server (status shows last line).
#       step     -> one-shot step of a pipeline (datagen, convert, finetune).
# enabled: false -> skipped by launch-all (placeholders not yet filled in by their owner).
# auto_resume: n -> after a crash (nonzero exit that wasn't a `stop`), relaunch with resume args up to n times.
# depends_on: the job waits (polling every 30 s) until each listed job has exited with code 0;
#             if one of them fails or is stopped, this job is marked "blocked" and does not run.

defaults:
  repo: ~/humanoid-sim-stack
  runs: ~/hsim_runs
  data: ~/hsim_data
  envs: ~/hsim_envs
  env:
    MUJOCO_GL: egl
    WANDB_MODE: offline
    PYTHONUNBUFFERED: "1"
    PATH: "~/.local/bin:{PATH}"          # uv lives in ~/.local/bin on this VM
    HF_HOME: "~/hsim_data/hf-cache"

jobs:
  # ------------------------------------------------------------------ locomotion (owner B)
  J1_g1_vel_v2:
    description: G1 velocity v2 (legs+waist, v2 recipe), owner B. SUPERSEDED by J1b (stood still)
    kind: rl
    enabled: false
    workdir: "{repo}/training/locomotion"
    command: "bash scripts/train_g1_velocity_v2.sh --log-root {log_root}"
    gpu_mem_gb: 12
    depends_on: []
    auto_resume: 2
    report:
      venv: "{repo}/training/locomotion/.venv"
      task: Hsim-G1-Velocity-Flat-v2              # confirmed (B)
      import_path: "{repo}/training/locomotion"   # sys.path entry so the task module imports
      import_module: hsim_tasks                   # registers the task
      eval: "{repo}/training/locomotion/.venv/bin/python scripts/eval_commands.py {checkpoint} --task Hsim-G1-Velocity-Flat-v2 --script deadband"

  J1b_g1_vel_v2:
    description: G1 velocity v2 + performance-gated curriculum (fix for J1 standing still), owner B. SUPERSEDED by J1c (arm self-collisions, no turning)
    kind: rl
    enabled: false
    workdir: "{repo}/training/locomotion"
    command: "bash scripts/train_g1_velocity_v2.sh --log-root {log_root}"
    gpu_mem_gb: 12
