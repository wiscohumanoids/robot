    workdir: "{repo}/training/locomotion"
    command: "bash scripts/train_g1_velocity_v2_resume.sh --from /home/ubuntu/hsim_runs/J1b_g1_vel_v2/g1_velocity_v2/2026-11-10_10-07-12/model_500.pt --log-root {log_root}"
    gpu_mem_gb: 12
    depends_on: []
    auto_resume: 0          # resume wrapper; relaunch manually if it crashes
    report:
