  J1c_g1_vel_v2:
    description: G1 velocity v2, resumed from J1b model_500 with arm-free self-collision penalty, safe arm ranges, slower curriculum gated on turning too, owner B. SUPERSEDED by J1d (arm-driven angular momentum)
    kind: rl
