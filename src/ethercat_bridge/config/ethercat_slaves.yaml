# EtherCAT slave configuration: CiA402 torque-mode drives, one entry per
# joint, CANONICAL_JOINT_ORDER (see humanoid_interfaces/config/canonical_joint_order.yaml).
#
# THIS FILE IS A TEMPLATE. Every vendor_id/product_id below is a placeholder
# (0x00000000) and MUST be replaced with the real values from each drive's
# datasheet/EtherCAT ESI (.xml) file before this can talk to real hardware.
# EthercatHardwareInterface::on_configure() logs an error and refuses to
# proceed if it finds an unfilled 0x00000000 placeholder still present.
#
# Field meanings and sources are documented in RESEARCH_NOTES.md section 1
# ("ethercat_driver_ros2"). Two fields there are flagged as UNCONFIRMED
# against a primary source in this session: the exact `dc_sync.cycle_time_us`
# key name (our own placeholder key, not a verified upstream field name) and
# the full Statusword bitmask decode table. Both are called out again below
# at the point they matter.

# --- Shared PDO mapping template ---
# All 23 joints in this repo use identical CiA402 objects (this is the
# standard CiA402 "servo drive" default PDO set: see RESEARCH_NOTES.md).
# If a real deployment uses more than one drive model (e.g. larger drives for
# legs, smaller ones for wrists), duplicate this anchor per drive family
# rather than editing each of the 23 entries individually.
pdo_template: &pdo_template
  rx_pdo:  # master -> slave (commands)
    controlword:    { index: 0x6040, sub_index: 0, type: uint16 }
    target_torque:  { index: 0x6071, sub_index: 0, type: int16,  command_interface: effort }
    mode_of_operation: { index: 0x6060, sub_index: 0, type: int8, value: 10 }  # 10 = Cyclic Synchronous Torque (CST)
  tx_pdo:  # slave -> master (feedback)
    statusword:       { index: 0x6041, sub_index: 0, type: uint16 }
    actual_position:  { index: 0x6064, sub_index: 0, type: int32, state_interface: position }
    actual_velocity:  { index: 0x606C, sub_index: 0, type: int32, state_interface: velocity }
    actual_torque:    { index: 0x6077, sub_index: 0, type: int16, state_interface: effort }
  # Distributed-clock sync, targeting this repo's 1kHz control loop
  # (see RESEARCH_NOTES.md: lowlevel_control and ethercat_bridge both run
  # at controller_manager's update_rate=1000, set in bringup/config/controllers.yaml).
  # TODO(unconfirmed): `cycle_time_us` is OUR OWN placeholder key name, not a
  # verified ethercat_driver_ros2/SOEM field: confirm the real field name
  # against ICube-Robotics/ethercat_driver_ros2_examples before relying on it.
  dc_sync:
    enabled: true
    cycle_time_us: 1000  # 1ms = 1kHz, matching g1_23dof_rev_1_0.xml's <option timestep="0.001">
  auto_fault_reset: false

