# CANONICAL_JOINT_ORDER: the single source of truth for the index order of
# every array-valued field in this package's messages (JointTargets.positions,
# JointCommand.position_target, RobotState.joint_positions,
# PolicyObservation.joint_positions, etc.) and for the <ros2_control> block in
# g1_description/g1_23dof.urdf.xacro (which carries this same order as an
# inline comment: if you change one, change both).
#
# Nodes index the arrays by position and do not load this file at runtime.
# tests/test_repo_consistency.py checks that the URDF <ros2_control> block,
# controllers.yaml, ethercat_slaves.yaml, the C++ defaults and the MJCF all list
# the same joints in this order, so change them together.
#
# 23 joints = bipedal_nav's g1_23dof_rev_1_0 variant: 6 DOF/leg x2, waist yaw
# only (roll+pitch locked), 5 DOF/arm (shoulder pitch/roll/yaw, elbow, wrist
# roll only: no wrist pitch/yaw, rubber hand end effector, no dexterous hand).
#
# See ARCHITECTURE.md for the berkeley_humanoid (29-DOF) reconciliation note.

joint_names:
  - left_hip_pitch_joint        # 0
  - left_hip_roll_joint         # 1
  - left_hip_yaw_joint          # 2
  - left_knee_joint             # 3
  - left_ankle_pitch_joint      # 4
  - left_ankle_roll_joint       # 5
  - right_hip_pitch_joint       # 6
  - right_hip_roll_joint        # 7
  - right_hip_yaw_joint         # 8
  - right_knee_joint            # 9
  - right_ankle_pitch_joint     # 10
  - right_ankle_roll_joint      # 11
  - waist_yaw_joint             # 12
  - left_shoulder_pitch_joint   # 13
  - left_shoulder_roll_joint    # 14
  - left_shoulder_yaw_joint     # 15
  - left_elbow_joint            # 16
  - left_wrist_roll_joint       # 17
  - right_shoulder_pitch_joint  # 18
  - right_shoulder_roll_joint   # 19
  - right_shoulder_yaw_joint    # 20
  - right_elbow_joint           # 21
  - right_wrist_roll_joint      # 22
